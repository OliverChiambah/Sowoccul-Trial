# Render Blueprint for SOWOCCUL
# ─────────────────────────────────────────────────────────────────────────────
# This file lets Render set up the whole stack in one flow instead of creating
# each piece by hand. In the Render dashboard: New → Blueprint → connect this
# repo → Render reads this file and shows you everything it will create. You
# review, fill in the few values it asks for, and click Apply.
#
# It creates THREE things:
#   1. sowoccul-db      — a managed PostgreSQL database (with daily backups)
#   2. sowoccul-api     — the Node/Express backend (server/)
#   3. sowoccul-web     — the React frontend as a static site (client/)
#
# WHAT RENDER FILLS IN AUTOMATICALLY
#   • DATABASE_URL on the API is wired from the database below — you don't paste it.
#   • JWT_SECRET is generated by Render (generateValue) — a strong random secret
#     you never have to see or handle.
#
# WHAT YOU FILL IN (Render will prompt for these — they're marked sync:false)
#   • ADMIN_USERNAME, ADMIN_PASSWORD, ADMIN_FULL_NAME, ADMIN_EMAIL, ADMIN_BRANCH
#     Used once by `npm run seed` to create your first admin login.
#   • Choose a STRONG ADMIN_PASSWORD (8+ chars). You'll change it after first login.
#
# AFTER IT DEPLOYS
#   • Open the API service → Shell → run:  npm run seed
#     (the admin vars are already in the environment, so it just works)
#   • Visit the web URL, sign in as that admin, change the password immediately.
#
# NOTE ON PLANS: the values below use paid starter tiers because managed Postgres
# with daily backups is not on the free tier, and a free web service sleeps when
# idle. Adjust `plan:` if you want. Confirm current prices in Render's dashboard.

databases:
  - name: sowoccul-db
    databaseName: sowoccul
    plan: basic-256mb          # smallest paid tier; includes daily backups
    # Render manages the user, password, host, SSL and backups for you.

services:
  # ── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: sowoccul-api
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sowoccul-db
          property: connectionString   # Render injects the internal URL (SSL on)
      - key: JWT_SECRET
        generateValue: true            # Render generates a strong random secret
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: PG_POOL_MAX
        value: "10"
      - key: LOG_LEVEL
        value: info
      - key: NODE_VERSION
        value: "20"
      # CORS: the API should accept requests from the web app's origin. After the
      # first deploy, set this to the web service's URL (shown in the dashboard),
      # e.g. https://sowoccul-web.onrender.com — or your custom domain.
      - key: CLIENT_ORIGIN
        sync: false
      # First-admin seed values — you provide these in the dashboard.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULL_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_BRANCH
        sync: false

  # ── Frontend (static site) ─────────────────────────────────────────────────
  - type: web
    name: sowoccul-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Route API calls to the backend so the frontend can keep using relative
    # /api URLs (no CORS needed for same-origin calls through this rewrite).
    #
    # ⚠️ CONFIRM THIS URL: Render names the API service's URL from its service
    # name, usually https://sowoccul-api.onrender.com — but if that name is taken
    # Render adds a suffix (e.g. sowoccul-api-xyz.onrender.com). After the first
    # deploy, open the sowoccul-api service, copy its real URL, and make sure the
    # destination below matches it exactly. If it doesn't, /api calls 404.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://sowoccul-api.onrender.com/api/*
      # SPA fallback: let React Router handle client-side routes.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Optional: if you prefer the frontend to call the API directly instead of
      # via the rewrite above, set this to the API URL and the app will use it.
      # Leaving it unset uses the relative /api routed by the rewrite rule.
      - key: VITE_API_BASE
        sync: false
