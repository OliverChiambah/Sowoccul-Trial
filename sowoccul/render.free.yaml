# Render Blueprint for SOWOCCUL — FREE TRIAL version
# ─────────────────────────────────────────────────────────────────────────────
# This is a FREE-TIER copy of render.yaml, meant for a trial run to check that
# everything builds, deploys, and works end-to-end. It is NOT for real members
# or real money — see the trade-offs below.
#
# To use it: either rename this file to render.yaml (Render reads render.yaml by
# default), OR in the Render dashboard choose "New → Blueprint" and point it at
# this file. Keep the original render.yaml for when you go to a paid launch.
#
# It creates THREE things, all on free tiers:
#   1. sowoccul-db   — free managed PostgreSQL
#   2. sowoccul-api  — the Node/Express backend (server/)
#   3. sowoccul-web  — the React frontend as a static site (client/)
#
# ⚠️ WHAT "FREE" COSTS YOU (know these before you judge the trial):
#   • The API SLEEPS after ~15 min of no traffic. The next visit waits ~30–60s
#     while it wakes up. Fine for testing; not acceptable for real members.
#   • Free Postgres is small and, on Render, EXPIRES after a limited period
#     (commonly ~30 days) and has no managed backups. Treat all trial data as
#     disposable. Confirm the current free-database terms in Render's dashboard.
#   • Free tiers throttle CPU/RAM — judge whether the app WORKS, not how fast.
#
# ⚠️ EMAIL: with no email provider set (below), verification + notification
#   emails are only LOGGED, not sent. That means NEW MEMBERS CAN'T VERIFY and so
#   CAN'T LOG IN. For a first trial, test with the ADMIN and STAFF accounts,
#   which skip email verification. To test the member signup flow, fill in the
#   EMAIL_* and PUBLIC_APP_URL values further down.
#
# AFTER IT DEPLOYS (same as the paid blueprint):
#   1. Open the sowoccul-api service → Shell → run:  npm run seed
#      (creates your first admin from the ADMIN_* values you entered)
#   2. Confirm the API's real URL (Render may add a suffix to the name). If it is
#      NOT https://sowoccul-api.onrender.com, update the rewrite destination in
#      the web service below to match, and set CLIENT_ORIGIN to the web URL.
#   3. Visit the web URL, sign in as that admin, change the password immediately.

databases:
  - name: sowoccul-db
    databaseName: sowoccul
    plan: free                 # free tier — small, no backups, expires; trial only

services:
  # ── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: sowoccul-api
    runtime: node
    plan: free                 # free tier — sleeps after ~15 min idle
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sowoccul-db
          property: connectionString   # Render injects the internal URL (SSL on)
      - key: JWT_SECRET
        generateValue: true            # Render generates a strong random secret
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: PG_POOL_MAX
        value: "5"                     # keep the pool small on the free database
      - key: LOG_LEVEL
        value: info
      - key: NODE_VERSION
        value: "20"
      # CORS: after the first deploy, set this to the web service's real URL,
      # e.g. https://sowoccul-web.onrender.com — or your custom domain.
      - key: CLIENT_ORIGIN
        sync: false

      # ── First administrator (you provide these in the dashboard) ────────────
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULL_NAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_BRANCH
        sync: false

      # ── Email (OPTIONAL for a first trial) ──────────────────────────────────
      # Leave these unset to run email in "mock" mode (emails are logged, not
      # sent) and test with admin/staff accounts. To test member signup +
      # verification, set EMAIL_PROVIDER and its settings, plus PUBLIC_APP_URL.
      #
      # PUBLIC_APP_URL makes the verification LINK clickable. Set it to the web
      # service's real URL once you know it, e.g. https://sowoccul-web.onrender.com
      - key: PUBLIC_APP_URL
        sync: false
      # EMAIL_PROVIDER: leave unset (defaults to 'mock'), or set 'smtp' / 'http'.
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_FROM
        sync: false
      # SMTP path (EMAIL_PROVIDER=smtp). NOTE: the SMTP sender needs the
      # 'nodemailer' package — add it to server/ (npm install nodemailer) and
      # commit, or SMTP sending will error.
      - key: EMAIL_SMTP_HOST
        sync: false
      - key: EMAIL_SMTP_PORT
        sync: false
      - key: EMAIL_SMTP_SECURE
        sync: false
      - key: EMAIL_SMTP_USER
        sync: false
      - key: EMAIL_SMTP_PASS
        sync: false
      # HTTP-API path (EMAIL_PROVIDER=http).
      - key: EMAIL_HTTP_URL
        sync: false
      - key: EMAIL_HTTP_AUTH
        sync: false

  # ── Frontend (static site) ─────────────────────────────────────────────────
  - type: web
    name: sowoccul-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Route /api calls to the backend so the frontend can use relative /api URLs.
    #
    # ⚠️ CONFIRM THIS URL after the first deploy. If the API service's real URL
    # is not https://sowoccul-api.onrender.com (Render may add a suffix), update
    # the destination below to match exactly, or every /api call will 404.
    routes:
      - type: rewrite
        source: /api/*
        destination: https://sowoccul-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        sync: false
